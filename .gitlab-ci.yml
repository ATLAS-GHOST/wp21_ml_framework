stages: [hat-train, qat-train, hls-convert, fw-build]

#Variables to link
variables:
  EOS_SAMPLES: "/eos/project-a/atlas-ngt-wp21"
  FILE: "/workspace/samples"
  WORK_DIR: "/workspace/workDir"
  PROJECT: "$CI_PROJECT_DIR" #Change to project folder (as sub-module)  

#Stage where the model is optimised against hyper-parameters
hat-train:
  stage: hat-train
  tags: [cern-nextgen-h100]
  image: registry.cern.ch/atlas-ngt-wp21/train
  script:
    - echo "$EOS_PASSWORD" | kinit "$EOS_USERNAME@CERN.CH" > /dev/null
    - ln -s "$EOS_SAMPLES" "$FILE"
    - ls /workspace/samples/
    - mkdir -p "$WORK_DIR"
    - ls "/workspace"
    
