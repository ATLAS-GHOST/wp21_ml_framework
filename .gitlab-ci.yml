stages: [setup-ci, hat-train, hat-split, qat-train, qat-split, hls-convert, fw-build]

#Variables to link
variables:
  EOS_SAMPLES: "/eos/project-a/atlas-ngt-wp21/samples/GlobalSamples/merged"
  FILE: "/workspace/samples"
  WORK_DIR: "/workspace/workDir"
  PROJECT: "$CI_PROJECT_DIR" #Change to project folder (as sub-module)
  META_PATH: "/eos/project/a/atlas-ngt-wp21/meta-data/$GITLAB_USER_LOGIN/$CI_COMMIT_SHA/"

#Helper definition
default:
  before_script:
    - myenv() { conda activate myenv; }
    - git submodule sync --recursive
    - git submodule update --init --recursive

#Stage file inclusion
include:
  - local: 'ci/_shared.yml'
  - local: 'ci/setup.yml'
  - local: 'ci/hat.yml'
  #- local: 'ci/qat.yml'
  #- local: 'ci/hls.yml'
  #- local: 'ci/fw.yml'    

