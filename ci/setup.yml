#YML file for setting up paths

setup-stage:
  stage: setup-ci
  extends: .common-train-small
  script:
    - echo "$EOS_PASSWORD" | kinit "$EOS_USERNAME@CERN.CH" 
    - export KRB5CCNAME=$(klist -e  | egrep -o 'FILE:.*')
    - mkdir -p $META_PATH
    - git submodule set-url project "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/atlas-nextgen-wp21/tau-classifier.git"
    - git submodule set-url wp21_train "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/atlas-nextgen-wp21/wp21_training_framework.git"
    - git submodule sync -- project wp21_train
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/".insteadOf "ssh://git@gitlab.cern.ch:7999/"
    - git submodule update --init --recursive --depth 1 project wp21_train
  artifacts:
    paths:
      - project/
      - wp21_train/
    expire_in: 2 days
