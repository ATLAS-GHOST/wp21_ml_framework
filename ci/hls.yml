# YML file for HLS stage

.hls-convert:
  stage: hls-convert
  extends: .common-hls-v2
  script:
    - echo "$EOS_PASSWORD" | kinit "$EOS_USERNAME@CERN.CH" > /dev/null
    - ln -s $EOS_SAMPLES/* $FILE
    - ls $PROJECT/project
    - mkdir -p "$FILE" "$WORK_DIR"
    - ln -s $PROJECT/* $WORK_DIR
    - ln -s qat/hat_$IDX $WORK_DIR
    - ls qat/
    - source ~/.bashrc
    - tf_v2
    #Temporary
    #- pip uninstall -y wp21_train
    #- pip install wp21_train
    #- conda remove -y pytorch-cuda
    - conda install conda-forge::cudatoolkit
    - mkdir -p "hls/qat_$SLOT"
    - export IN_PATH="qat/qat_$SLOT/config_$SUB"
    - export OUT_PATH="hls_$SLOT/model_$SUB"
    - export META_NEW="$META_PATH/hls_$SLOT/qat_$SUB"
    - python $PROJECT/project/train_physics.py -hls_enable -fin $IN_PATH -meta $META_NEW -fout $OUT_PATH -sample_map $PROJECT/project/sample_mapping.json -sig 'Py8EG_A14NNPDF23LO_Gammatautau_MassWeight' -bg 'Py8EG_A14NNPDF23LO_jj_JZ0' -type 'qat'
    - cp "qat/qat_$SLOT/config_$SUB.json" "hls_$SLOT/model_$SUB/config_$SUB.json"
    - ls "hls_$SLOT/model_$SUB/"
  artifacts:
    paths:
      - hls_$SLOT/model_$SUB/
      - $PROJECT/project
    expire_in: 2 days        

# Pipeline-0
hls-0-0: { extends: .hls-convert, needs: [{job: qat-split-0-0, artifacts: true}], variables: { SLOT: "0", SUB: "0" } }
hls-0-1: { extends: .hls-convert, needs: [{job: qat-split-0-1, artifacts: true}], variables: { SLOT: "0", SUB: "1" } }
hls-0-2: { extends: .hls-convert, needs: [{job: qat-split-0-2, artifacts: true}], variables: { SLOT: "0", SUB: "2" } }
