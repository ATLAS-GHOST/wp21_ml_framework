# YML file for HLS stage

.hls-convert:
  stage: hls-convert
  image: .common-hls
  script:
    - set -euo pipefail
    - test -d "qat/hat_$SLOT/qat_$SUB" || { echo "Missing qat/hat_$SLOT/qat_$SUB"; exit 1; }
    - mkdir -p "hls/qat_$SLOT/hls_$SUB"
  artifacts: { paths: ["hls/qat_$SLOT/hls_$SUB"], expire_in: 2 days }

# Pipeline-0
hls-0-0: { extends: .hls-convert, needs: [{job: qat-split-0-0, artifacts: true}], variables: { SLOT: "0", SUB: "0" } }
hls-0-1: { extends: .hls-convert, needs: [{job: qat-split-0-1, artifacts: true}], variables: { SLOT: "0", SUB: "1" } }
hls-0-2: { extends: .hls-convert, needs: [{job: qat-split-0-2, artifacts: true}], variables: { SLOT: "0", SUB: "2" } }
hls-0-3: { extends: .hls-convert, needs: [{job: qat-split-0-3, artifacts: true}], variables: { SLOT: "0", SUB: "3" } }
hls-0-4: { extends: .hls-convert, needs: [{job: qat-split-0-4, artifacts: true}], variables: { SLOT: "0", SUB: "4" } }

