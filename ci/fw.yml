#YML file for FW stage

.fw-build:
  stage: fw-build
  extends: .common-fw
  script:
    - set -euo pipefail
    - test -d "hls/qat_$SLOT/hls_$SUB" || { echo "missing hls/qat_$SLOT/hls_$SUB"; exit 1; }
    - mkdir -p "fw/hls_$SLOT/fw_$SUB"
  artifacts: { paths: ["fw/hls_$SLOT/fw_$SUB"], expire_in: 7 days }

# Pipeline-0
fw-build-0-0: { extends: .fw-build, needs: [{job: "hls-0-0", artifacts: true}], variables: { SLOT: "0", SUB: "0" } }
fw-build-0-1: { extends: .fw-build, needs: [{job: "hls-0-1", artifacts: true}], variables: { SLOT: "0", SUB: "1" } }
