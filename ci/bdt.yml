# YML file for BDT training

bdt-train:
  stage: bdt-train
  extends: .common-train-v2
  needs:
    - job: setup-stage
      artifacts: true 
  script:
    - echo "$EOS_PASSWORD" | kinit "$EOS_USERNAME@CERN.CH"
    - export KRB5CCNAME=$(klist -e  | egrep -o 'FILE:.*')
    - mkdir -p "$FILE/samples" "$WORK_DIR"
    - ln -sfnT "$EOS_SAMPLES" "$FILE/samples/GlobalSamples"
    - ln -sfnT "$PROJECT/project" "$WORK_DIR/project"
    - source ~/.bashrc
    - xgboost
    - |
      export CONIFER_SOURCE="$PROJECT/project/conifer"
      if [ ! -d "$CONIFER_SOURCE/conifer" ]; then
        echo "Expected conifer checkout at $CONIFER_SOURCE, but it was not found."
        exit 1
      fi
      export PYTHONPATH="$CONIFER_SOURCE:$PROJECT/wp21_train:${PYTHONPATH:-}"
      python - <<'PY'
      import importlib.util

      spec = importlib.util.find_spec("conifer")
      if spec is None:
          raise SystemExit("Could not resolve conifer on PYTHONPATH")
      print(f"Using conifer from: {spec.origin}")
      PY
    - cd "$PROJECT/project"
    - chmod +x run_train_physics.sh
    - ./run_train_physics.sh --bdt
  artifacts:
    paths:
      - project/out/
#      - project/debug_dataset.pkl
    expire_in: 2 days
