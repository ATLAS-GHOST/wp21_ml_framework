#YML file for HAT stage

hat-train:
  stage: hat-train
  extends: .common-train-v2
  needs:
    - job: setup-stage
      artifacts: true
  script:
    - echo "$EOS_PASSWORD" | kinit "$EOS_USERNAME@CERN.CH" > /dev/null
    - ln -s $EOS_SAMPLES/* $FILE
    - ls $PROJECT/project
    - mkdir -p "$FILE" "$WORK_DIR"
    - ln -s $PROJECT/* $WORK_DIR
    - source ~/.bashrc
    - tf_v2
    #Temporary
    #- pip uninstall -y wp21_train
    #- pip install wp21_train
    #- conda remove -y pytorch-cuda
    #- conda install conda-forge::cudatoolkit
    - python -m pip install -U nvidia-cuda-nvrtc-cu11 nvidia-cuda-runtime-cu11
    - export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${CONDA_PREFIX}/lib64:/usr/local/cuda/targets/x86_64-linux/lib:${LD_LIBRARY_PATH:-}"
    - mkdir out
    - python $PROJECT/project/train_physics.py -fin $PROJECT/project/config_physics -meta "$META_PATH/hat" -fout '' -sample_map $PROJECT/project/sample_mapping.json -sig 'Py8EG_A14NNPDF23LO_Gammatautau_MassWeight' -bg 'Py8EG_A14NNPDF23LO_jj_JZ0' -type 'hat'
  artifacts:
    paths:
      - out/
      - $PROJECT/project
    expire_in: 2 days

.hat-split:
  stage: hat-split
  extends: .common-small
  script:
    - set -euo pipefail
    - idx=$IDX
    - test -f "out/config_$idx.json" || { echo "missing out/config_$idx.json"; exit 1; }
    - mkdir -p "sel/hat_$idx" && mv "out/config_$idx.json" "sel/hat_$idx/config_$idx.json"
    - rm -rf out && mv sel out
    - ls -R out
  artifacts:
    paths:
      - out/
      - $PROJECT/project
    expire_in: 2 days

hat-split-0: { extends: .hat-split, needs: [hat-train], variables: { IDX: "0" } }
hat-split-1: { extends: .hat-split, needs: [hat-train], variables: { IDX: "1" } }
hat-split-2: { extends: .hat-split, needs: [hat-train], variables: { IDX: "2" } }
hat-split-3: { extends: .hat-split, needs: [hat-train], variables: { IDX: "3" } }
hat-split-4: { extends: .hat-split, needs: [hat-train], variables: { IDX: "4" } }
